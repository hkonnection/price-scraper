name: Scrape Lululemon

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing to database'
        required: false
        default: 'false'
        type: boolean

  # Auto-scrape on schedule
  schedule:
    - cron: '0 16 * * 1'   # Monday 8am PST (4pm UTC)
    - cron: '0 16 * * 4'   # Thursday 8am PST (backup/mid-week)

  repository_dispatch:
    types: [scrape-lululemon]

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install --workspace=scraper --legacy-peer-deps

      - name: Install Playwright Chrome
        run: npx playwright install chrome --with-deps
        working-directory: scraper

      - name: Run Lululemon scraper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run scrape:lululemon:dry
          else
            npm run scrape:lululemon
          fi
        working-directory: scraper

      - name: Summary
        run: echo "Lululemon scrape completed at $(date)"
